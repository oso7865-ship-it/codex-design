<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>챱챱 Clickable Wireframe Prototype</title>
<style>
*{box-sizing:border-box}
:root{--line:#cfd3d8;--line2:#e7e9ec;--text:#1c1f23;--muted:#6c737c;--bg:#f5f6f7;--white:#fff}
body{margin:0;font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:270px minmax(680px,1fr) 310px;height:100vh;overflow:hidden}
.sidebar,.inspector{background:var(--white);overflow:auto;border-right:1px solid var(--line2)}
.inspector{border-right:0;border-left:1px solid var(--line2)}
.brand{position:sticky;top:0;background:#fff;z-index:3;padding:20px;border-bottom:1px solid var(--line2)}
.brand strong{font-size:22px;display:block} .brand small{color:var(--muted)}
.nav-group{padding:12px 10px 4px} .nav-title{font-size:12px;font-weight:700;color:var(--muted);padding:8px 10px;text-transform:uppercase}
.nav-item{width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:8px;display:flex;gap:10px;align-items:center}
.nav-item span{font-size:11px;color:var(--muted);width:28px} .nav-item:hover,.nav-item.active{background:#eef0f2}
.workspace{overflow:auto}
.topbar{position:sticky;top:0;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line2);padding:12px 22px;display:flex;justify-content:space-between;align-items:center;z-index:4}
.topbar .crumb{font-weight:700} .top-actions{display:flex;gap:8px}
.canvas-wrap{padding:34px;min-height:100%}
.browser{max-width:1080px;margin:auto;background:#fff;border:1px solid #aeb4bb;border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,.06);overflow:hidden}
.browserbar{height:42px;border-bottom:1px solid var(--line2);display:flex;gap:7px;align-items:center;padding:0 14px;background:#fafafa}
.dot{width:10px;height:10px;border:1px solid #aeb4bb;border-radius:50%}
.url{margin-left:10px;height:24px;border:1px solid var(--line2);border-radius:5px;flex:1;padding:4px 10px;color:var(--muted);font-size:12px}
.site-header{border-bottom:1px solid var(--line2);padding:16px 26px;display:flex;justify-content:space-between;align-items:center}
.site-header strong{font-size:20px} .site-header nav{display:flex;gap:8px;align-items:center}
.site-header nav button{border:0;background:transparent;padding:8px}
.page{padding:34px;min-height:650px}
h1{font-size:30px;margin:0 0 18px} h2{margin-top:30px} h3{margin:20px 0 10px}
p{line-height:1.6} .muted{color:var(--muted);font-size:14px}
.box,.card{border:1px solid var(--line);background:#fff;border-radius:9px;padding:20px}
.hero{padding:42px} .hero h1{font-size:38px} .eyebrow,.badge{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:5px 9px;display:inline-block}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px} .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card-title{font-weight:700;font-size:17px;margin-bottom:8px} .card .btn{margin-top:16px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px} .actions.end{justify-content:flex-end}
.btn{border:1px solid #1f2328;background:#1f2328;color:white;border-radius:7px;padding:10px 15px;font-weight:700}
.btn.secondary{background:#fff;color:#1f2328} .btn.ghost{background:transparent;color:#1f2328;border-color:transparent;text-decoration:underline}
.btn.danger{background:#fff;color:#1f2328;border-style:dashed} .btn:disabled{opacity:.4;cursor:not-allowed}
.narrow{max-width:520px;margin:30px auto} .center{text-align:center}
label{display:block;font-weight:700;margin:14px 0} input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:6px;margin-top:6px;background:#fff}
textarea{min-height:100px} .radio,.check{font-weight:400;display:flex;gap:8px;align-items:center} .radio input,.check input{width:auto;margin:0}
.linkrow{display:flex;justify-content:space-between} .divider{text-align:center;color:var(--muted);margin:20px 0;border-top:1px solid var(--line2);padding-top:16px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px} .toolbar h1{margin-bottom:0}
.chips{display:flex;gap:8px;flex-wrap:wrap} .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px} .chip.active{background:#1f2328;color:#fff} .chip.disabled{opacity:.35}
.detail2{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center} .image-placeholder{min-height:330px;border:1px dashed #8e969f;background:#fafafa;display:flex;align-items:center;justify-content:center;color:#8e969f}
.image-placeholder.small{min-height:130px;margin-bottom:14px} .product{padding:14px}
.summary{display:grid;gap:0} .summary>div{display:flex;justify-content:space-between;gap:18px;padding:13px 0;border-bottom:1px solid var(--line2)} .summary>div:last-child{border-bottom:0}
.summary span{text-align:right;color:var(--muted)}
.stepper{display:flex;margin-bottom:28px;border-bottom:1px solid var(--line2);padding-bottom:18px} .step{flex:1;color:var(--muted);font-size:12px;display:flex;gap:7px;align-items:center} .step span{width:25px;height:25px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center} .step.current,.step.done{color:var(--text);font-weight:700} .step.current span,.step.done span{background:#1f2328;color:#fff}
.stack{display:grid;gap:12px} .select-card{display:flex;gap:12px;border:1px solid var(--line);border-radius:8px;padding:15px;font-weight:400} .select-card input{width:auto;margin:3px 0 0} .select-card p{margin:4px 0}
.qty{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line2);border-radius:6px;margin-top:12px} .qty button{border:0;background:#fafafa;padding:8px 12px}
.sticky-summary{margin-top:18px;border:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-radius:8px} .sticky-summary div{display:flex;flex-direction:column;gap:3px}
.state-note{margin-top:18px;border:1px dashed #9ba2aa;background:#fafafa;padding:12px;border-radius:7px;color:#4d545c;font-size:13px}
.result-icon{width:64px;height:64px;border:2px solid #1f2328;border-radius:50%;display:grid;place-items:center;margin:0 auto 20px;font-size:28px;font-weight:bold}
.timeline{display:grid;gap:10px} .cycle-row{border:1px solid var(--line);background:#fff;border-radius:8px;padding:17px;text-align:left;display:flex;justify-content:space-between;align-items:center} .cycle-row div{display:flex;flex-direction:column;gap:5px} .cycle-row span{color:var(--muted)}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px} table{width:100%;border-collapse:collapse} th,td{padding:13px 14px;border-bottom:1px solid var(--line2);text-align:left;font-size:14px} th{background:#fafafa}
.skeleton-lines{display:grid;gap:10px;margin-top:20px} .skeleton-lines span{display:block;height:18px;background:#eceff1;border-radius:5px} .skeleton-lines .short{width:55%}
.inspector-inner{padding:20px} .inspector h3{margin-top:24px} .info-row{padding:9px 0;border-bottom:1px solid var(--line2)} .info-row strong{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.flow-list{display:grid;gap:7px} .flow-list button{border:1px solid var(--line);background:#fff;text-align:left;padding:9px;border-radius:6px}
.kbd{font-family:monospace;border:1px solid var(--line);padding:2px 5px;border-radius:4px;font-size:11px}
@media(max-width:1100px){.app{grid-template-columns:220px 1fr}.inspector{display:none}}
@media(max-width:820px){.app{grid-template-columns:1fr}.sidebar{display:none}.canvas-wrap{padding:12px}.page{padding:20px}.grid3,.grid2,.detail2{grid-template-columns:1fr}}
</style>

<style>
.preview-mobile .browser{max-width:390px}
.preview-mobile .site-header{padding:12px 14px}
.preview-mobile .site-header nav{display:none}
.preview-mobile .page{padding:20px;min-height:720px}
.preview-mobile .grid3,.preview-mobile .grid2,.preview-mobile .detail2{grid-template-columns:1fr}
.preview-mobile .hero{padding:24px}
.preview-mobile .hero h1{font-size:28px}
.preview-mobile .stepper{overflow-x:auto;gap:8px}
.preview-mobile .step{min-width:82px}
.nav-search{padding:10px;position:sticky;top:82px;background:white;z-index:2;border-bottom:1px solid var(--line2)}
.nav-search input{margin:0}
.view-toggle{display:flex;gap:6px}
.view-toggle button.active{background:#1f2328;color:#fff}
.mobile-bottom{display:none}
.preview-mobile .mobile-bottom{display:flex;position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line2);justify-content:space-around;padding:9px;z-index:4}
.preview-mobile .mobile-bottom button{border:0;background:#fff;font-size:12px}
</style>


<style id="rebuild-v2">
:root{
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px;
  --space-6:24px; --space-8:32px; --space-10:40px; --space-12:48px; --space-16:64px;
  --radius-sm:8px; --radius-md:12px; --radius-lg:18px;
  --ink:#17191c; --ink-2:#4d545c; --muted:#747b84; --surface:#fff;
  --surface-2:#f7f8f9; --surface-3:#eef0f2; --border:#d8dde2; --focus:#111;
  --content:1120px; --readable:720px;
}
body{background:#f1f3f5}
.browser{max-width:var(--content);border-radius:16px}
.page{padding:var(--space-8);min-height:720px}
.page>section+section{margin-top:var(--space-12)}
h1{font-size:clamp(28px,3vw,42px);line-height:1.15;letter-spacing:-.03em;margin:0 0 var(--space-5)}
h2{font-size:clamp(21px,2vw,28px);letter-spacing:-.02em;margin:var(--space-10) 0 var(--space-4)}
h3{font-size:18px;line-height:1.35;margin:var(--space-6) 0 var(--space-3)}
p{color:var(--ink-2)}
.muted{color:var(--muted)}
.badge,.eyebrow{background:var(--surface-2);font-weight:700;letter-spacing:.01em}
.box,.card{border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:none}
.card{transition:transform .15s ease,border-color .15s ease}
.card:hover{border-color:#aeb5bc}
.btn{min-height:44px;border-radius:10px;padding:10px 16px}
.btn:focus-visible,.chip:focus-visible,.nav-item:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:3px solid rgba(23,25,28,.22);outline-offset:2px
}
.btn.primary{background:var(--ink);color:#fff}
.btn.secondary{background:#fff;color:var(--ink);border-color:var(--border)}
.btn.ghost{min-height:40px}
.actions{gap:var(--space-2)}
.grid3{gap:var(--space-4)}
.grid2{gap:var(--space-4)}
.hero{
  padding:clamp(28px,5vw,64px);
  background:linear-gradient(180deg,#fff,#f8f9fa);
  border-radius:var(--radius-lg)
}
.hero p{max-width:620px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:16px}
.section-head h2{margin:0}
.kicker{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.metric{border:1px solid var(--border);border-radius:12px;padding:16px;background:#fff}
.metric strong{display:block;font-size:22px;margin-top:4px}
.feature-card{padding:20px}
.feature-card .num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#17191c;color:#fff;font-size:12px;font-weight:800;margin-bottom:14px}
.card .image-placeholder,.image-placeholder{border-radius:10px;background:#f7f8f9}
.toolbar{align-items:flex-end;margin-bottom:20px}
.toolbar h1{margin:4px 0 0}
.summary>div{padding:15px 0}
.summary strong{font-size:14px}
.summary span{max-width:62%}
.stepper{gap:4px}
.step{padding:6px 4px;min-width:0}
.step span{flex:0 0 28px;width:28px;height:28px}
.select-card{padding:16px;align-items:flex-start}
.select-card:has(input:checked){border-color:#1f2328;background:#fafafa}
.qty button{min-width:40px;min-height:40px}
.sticky-summary{position:sticky;bottom:12px;background:#fff;z-index:3;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.state-note{line-height:1.55}
.empty-state{text-align:center;padding:48px 20px;border:1px dashed var(--border);border-radius:12px;background:#fafafa}
.mobile-bottom button{min-width:56px;min-height:44px}
.site-header{position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);z-index:4}
.site-header nav button{min-height:40px;border-radius:8px}
.site-header nav button:hover{background:#f2f3f4}
.list-card{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px;border:1px solid var(--border);border-radius:12px;background:#fff}
.list-card+.list-card{margin-top:10px}
.list-main{min-width:0}.list-main strong{display:block}.list-main span{display:block;margin-top:5px;color:var(--muted);font-size:13px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.form-grid .full{grid-column:1/-1}
.helper{font-size:12px;color:var(--muted);margin-top:6px}
.notice{border-left:3px solid #222;background:#f7f8f9;padding:14px 16px;border-radius:0 10px 10px 0}
.admin-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.admin-kpis .metric strong{font-size:24px}
@media(max-width:820px){
  .page{padding:20px 16px 88px}
  .hero{padding:28px 20px}
  .hero h1{font-size:30px}
  .grid3,.grid2,.detail2,.metric-row,.admin-kpis,.form-grid{grid-template-columns:1fr}
  .form-grid .full{grid-column:auto}
  .toolbar,.section-head{align-items:flex-start;flex-direction:column}
  .summary>div{align-items:flex-start;flex-direction:column;gap:5px}
  .summary span{max-width:100%;text-align:left}
  .stepper{overflow-x:auto;padding-bottom:12px}
  .step{min-width:104px}
  .sticky-summary{bottom:72px;align-items:flex-start;gap:12px;flex-direction:column}
  .sticky-summary .btn{width:100%}
}
.preview-mobile .browser{max-width:390px}
.preview-mobile .page{padding:20px 16px 88px}
.preview-mobile .metric-row,.preview-mobile .admin-kpis,.preview-mobile .form-grid{grid-template-columns:1fr}
.preview-mobile .toolbar,.preview-mobile .section-head{align-items:flex-start;flex-direction:column}
.preview-mobile .summary>div{align-items:flex-start;flex-direction:column;gap:5px}
.preview-mobile .summary span{max-width:100%;text-align:left}
</style>


<style id="admin-desktop-only-style">

<style id="mobile-auth-nav-v5">
/* 사용자 모바일 전용 하단 고정 네비게이션 */
.preview-mobile .mobile-bottom,
@media(max-width:820px){

.preview-mobile .page{padding-bottom:92px !important}

<style id="chapchap-subscription-design">
:root{
  --color-primary:#96A75E;
  --color-primary-hover:#A4B46E;
  --color-primary-pressed:#7D8E49;
  --color-primary-soft:#F5F7EC;
  --color-secondary:#F28C28;
  --color-secondary-soft:#FFF3E5;
  --color-background:#FFFDF9;
  --color-surface:#FFFFFF;
  --color-surface-subtle:#F8F8F4;
  --color-text:#33352F;
  --color-text-muted:#7B7F75;
  --color-border:#ECEFE5;
  --color-success:#5D8B70;
  --color-warning:#C9982E;
  --color-warning-soft:#FFF8DC;
  --color-danger:#C96359;
  --color-info:#6689A3;
}
body{background:var(--color-background);color:var(--color-text)}
.site-header,.mobile-bottom,.sidebar,.inspector{background:var(--color-surface)}
.card,.box,.metric,.select-card,.cycle-row,.sticky-summary{border-color:var(--color-border)}
.muted,.helper,.list-main span{color:var(--color-text-muted)}
.btn.primary{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-text)}
.btn.primary:hover{background:var(--color-primary-hover)}
.btn.primary:active{background:var(--color-primary-pressed)}
.btn.trial{background:var(--color-secondary);border-color:var(--color-secondary);color:var(--color-text)}
.btn.trial:hover{background:#F5A04A}.btn.trial:active{background:#D97716}
.chip.active,.step.current span,.step.done span{background:var(--color-primary);color:var(--color-text);border-color:var(--color-primary)}
.select-card:has(input:checked){border-color:var(--color-primary);background:var(--color-primary-soft)}
.status-success{background:#EDF6F0;color:var(--color-success)}
.status-warning{background:var(--color-warning-soft);color:#6F5312}
.status-info{background:#EDF4F8;color:var(--color-info)}
.plan-card--recommended{background:var(--color-secondary-soft);border:2px solid var(--color-secondary);position:relative}
.recommend-badge{display:inline-flex;align-items:center;gap:4px;background:var(--color-secondary);color:var(--color-text);border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}
.menu-limit-note{display:flex;gap:8px;align-items:flex-start;margin:20px 0;padding:14px 16px;border-radius:10px;background:var(--color-warning-soft);color:#6F5312;font-size:13px;line-height:1.5}
.menu-limit-note strong{white-space:nowrap}.menu-card--limited{opacity:.56;filter:saturate(.65)}
.trial-conversion{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);width:min(540px,calc(100vw - 32px));z-index:120;background:var(--color-surface);border:1px solid var(--color-border);border-radius:18px;padding:24px;box-shadow:0 18px 48px rgba(30,32,28,.24)}
.trial-conversion h2{margin:8px 0}.trial-conversion .actions{justify-content:flex-end}
@media(max-width:820px){
  .page{padding-bottom:112px!important}
  .actions{width:100%;display:grid;grid-template-columns:1fr 1fr}
  .actions .btn{width:100%}.actions .btn:only-child{grid-column:1/-1}
  .sticky-summary{bottom:78px;padding:14px;gap:10px}
  .mobile-bottom{justify-content:space-between!important}
  .trial-conversion{bottom:76px;border-radius:18px 18px 0 0;width:100%;padding:22px 20px calc(22px + env(safe-area-inset-bottom))}

const historyStack = [];
let current = "WF-001";

function stepper(n){return "";}
function render(wf) {
  current = wf;
  const m = meta[wf];
  document.getElementById("crumb").textContent = wf + " · " + m.title;
  document.getElementById("fakeUrl").textContent = "chopchop.local/" + wf.toLowerCase();
  document.getElementById("insTitle").textContent = m.title;
  document.getElementById("insId").textContent = wf;
  document.getElementById("insCat").textContent = m.category;
  document.getElementById("insDesc").textContent = m.desc;
  document.querySelectorAll(".nav-item").forEach(x => x.classList.toggle("active", x.dataset.wf === wf));
  document.getElementById("page").innerHTML = templates[wf] || "<h1>화면을 찾을 수 없습니다.</h1>";
  location.hash = wf;
  window.scrollTo(0,0);
}

function go(wf) {
  if (!meta[wf]) return;
  if (current !== wf) historyStack.push(current);
  render(wf);
}

document.addEventListener("click", e => {
  const goEl = e.target.closest("[data-go]");
  if (goEl) { go(goEl.dataset.go); return; }
  const act = e.target.closest("[data-action]");
  if (!act) return;
  const a = act.dataset.action;
  if (a === "payment-failed") document.getElementById("payment-state").textContent = "결제 실패: 예약 재고 해제 후 재시도 안내";
  if (a === "payment-unknown") document.getElementById("payment-state").textContent = "결제 결과 확인 중: 실패로 확정하지 않고 PG 거래 결과 조회";

</div>\n      <button class=\"btn ghost\" disabled>품절</button>\n    </div>\n        </div>", "WF-009": "\n        <div class=\"detail2\">\n          <div class=\"image-placeholder\">PRODUCT IMAGE</div>\n          <div>\n            <span class=\"badge\">GENERAL</span>\n            <h1>닭가슴살 도시락</h1>\n            <h2>8,900원</h2>\n            <p>구성·용량 / 보관·섭취 방법 / 영양정보</p>\n            <div class=\"actions\"><button class=\"btn primary\" data-go=\"WF-010\">구독 플랜 보기</button><button class=\"btn secondary\" data-go=\"WF-008\">상품 목록</button></div>\n          </div>\n        </div>", "WF-010": "\n        <h1>나에게 맞는 플랜을 골라보세요</h1>\n        <div class=\"grid3\">\n          <div class=\"card\">\n      <div class=\"card-title\">1주 체험</div>\n      <div class=\"muted\">계정당 1회 · 메뉴 3개 고정 · 30% 할인 · 자동연장 없음</div>\n      <button class=\"btn primary\" data-go=\"WF-012\">체험 상세</button>\n    </div>\n          <div class=\"card\">\n      <div class=\"card-title\">Solo</div>\n      <div class=\"muted\">2주 · 주차별 3개 이상 · 총 6개 이상 · 자동연장</div>\n      <button class=\"btn primary\" data-go=\"WF-011\">플랜 상세</button>\n    </div>\n          <div class=\"card\">\n      <div class=\"card-title\">Family</div>\n      <div class=\"muted\">2주 · 주차별 6개 이상 · 총 12개 이상 · 무료배송</div>\n      <button class=\"btn primary\" data-go=\"WF-011\">플랜 상세</button>\n    </div>\n        </div>", "WF-011": "\n        <div class=\"narrow\">\n          <span class=\"eyebrow\">SUBSCRIPTION</span>\n          <h1>Solo 2주 플랜</h1>\n          <p>2주 선결제 · 자동연장 · 주차별 3개 이상 · 2주 총 6개 이상</p>\n          <div class=\"summary box\">\n            <div><strong>배송 요일</strong><span>월~토 복수 선택</span></div>\n            <div><strong>시간대</strong><span>점심 / 저녁</span></div>\n            <div><strong>변경 마감</strong><span>배송 2일 전 18:00</span></div>\n          </div>\n          <button class=\"btn primary\" data-go=\"WF-013\">이 플랜으로 시작</button>\n          <div class=\"state-note\">체험 사용 이력이 있으면 신청 CTA 대신 “이미 이용한 체험입니다” 안내</div>\n        </div>", "WF-012": "\n        <div class=\"narrow\">\n          <span class=\"eyebrow\">TRIAL</span>\n          <h1>1주 체험</h1>\n          <p>계정당 1회 · 자동결제/자동전환 없음</p>\n          <div class=\"summary box\">\n            <div><strong>배송 요일</strong><span>월~토 복수 선택</span></div>\n            <div><strong>시간대</strong><span>점심 / 저녁</span></div>\n            <div><strong>변경 마감</strong><span>배송 2일 전 18:00</span></div>\n          </div>\n          <button class=\"btn primary\" data-go=\"WF-013\">이 플랜으로 시작</button>\n          <div class=\"state-note\">체험 사용 이력이 있으면 신청 CTA 대신 “이미 이용한 체험입니다” 안내</div>\n        </div>", "WF-013": "\n        <div class=\"stepper\"><div class=\"step current\"><span>1</span>배송</div><div class=\"step \"><span>2</span>배송지</div><div class=\"step \"><span>3</span>메뉴</div><div class=\"step \"><span>4</span>확인</div><div class=\"step \"><span>5</span>결제</div></div>\n        <h1>배송 요일과 시간대를 선택해주세요</h1>\n        <div class=\"box\">\n          <h3>배송 요일</h3>\n          <div class=\"chips\"><button class=\"chip active\" >월</button><button class=\"chip\" >화</button><button class=\"chip active\" >수</button><button class=\"chip\" >목</button><button class=\"chip active\" >금</button><button class=\"chip\" >토</button></div>\n          <h3>기본 시간대</h3>\n          <label class=\"radio\"><input type=\"radio\" name=\"time\" checked> 점심 11:00~14:00</label>\n          <label class=\"radio\"><input type=\"radio\" name=\"time\"> 저녁 17:00~20:00</label>\n        </div>\n        <div class=\"actions end\"><button class=\"btn secondary\" data-go=\"WF-011\">이전</button><button class=\"btn primary\" data-go=\"WF-014\">다음: 배송지</button></div>\n        <div class=\"state-note\">휴무일·일요일·수용량 초과 슬롯은 선택 불가. 신규/변경 배송일은 최소 3일 이후.</div>", "WF-014": "\n        <div class=\"stepper\"><div class=\"step done\"><span>1</span>배송</div><div class=\"step current\"><span>2</span>배송지</div><div class=\"step \"><span>3</span>메뉴</div><div class=\"step \"><span>4</span>확인</div><div class=\"step \"><span>5</span>결제</div></div>\n        <h1>배송지를 선택해주세요</h1>\n        <div class=\"stack\">\n          <label class=\"select-card\"><input type=\"radio\" name=\"addr\" checked><div><strong>집 · 기본배송지</strong><p>대구광역시 중구 중앙대로 000</p></div></label>\n          <label class=\"select-card\"><input type=\"radio\" name=\"addr\"><div><strong>회사</strong><p>대구광역시 수성구 동대구로 000</p></div></label>\n        </div>\n        <div class=\"actions\"><button class=\"btn secondary\" data-go=\"WF-029\">새 배송지 등록</button></div>\n        <div class=\"actions end\"><button class=\"btn secondary\" data-go=\"WF-013\">이전</button><button class=\"btn primary\" data-go=\"WF-015\">다음: 메뉴</button></div>\n        <div class=\"state-note\">대구 외 주소·검증 실패·운영 불가 주소는 선택할 수 없음.</div>", "WF-015": "\n        <div class=\"stepper\"><div class=\"step done\"><span>1</span>배송</div><div class=\"step done\"><span>2</span>배송지</div><div class=\"step current\"><span>3</span>메뉴</div><div class=\"step \"><span>4</span>확인</div><div class=\"step \"><span>5</span>결제</div></div>\n        <div class=\"toolbar\"><h1>메뉴를 구성해주세요</h1><div><button class=\"chip active\" >전체</button> <button class=\"chip\" >일반</button> <button class=\"chip\" >키즈</button></div></div>\n        <div class=\"grid3\">\n          <div class=\"card product\">\n      <div class=\"image-placeholder small\">IMAGE</div>\n      <div class=\"card-title\">닭가슴살 도시락</div>\n      <div class=\"muted\">8,900원</div>\n      <div class=\"qty\"><button>−</button><strong>2</strong><button>＋</button></div>\n    </div>\n          <div class=\"card product\">\n      <div class=\"image-placeholder small\">IMAGE</div>\n      <div class=\"card-title\">불고기 도시락</div>\n      <div class=\"muted\">9,500원</div>\n      <div class=\"qty\"><button>−</button><strong>1</strong><button>＋</button></div>\n    </div>\n          <div class=\"card product\">\n      <div class=\"image-placeholder small\">IMAGE</div>\n      <div class=\"card-title\">키즈 미트볼</div>\n      <div class=\"muted\">8,500원</div>\n      <div class=\"qty\"><button>−</button><strong>1</strong><button>＋</button></div>\n    </div>\n        </div>\n        <div class=\"sticky-summary\"><div><strong>선택 수량 4개</strong><span>Solo 주차별 최소 3개 · 2주 총 6개 이상</span></div><button class=\"btn primary\" data-go=\"WF-016\">다음: 주문 확인</button></div>\n        <div class=\"state-note\">최소 수량 미달·품절·재고 부족이면 다음 단계 진입 차단.</div>", "WF-016": "\n        <div class=\"stepper\"><div class=\"step done\"><span>1</span>배송</div><div class=\"step done\"><span>2</span>배송지</div><div class=\"step done\"><span>3</span>메뉴</div><div class=\"step current\"><span>4</span>확인</div><div class=\"step \"><span>5</span>결제</div></div>\n        <h1>구독 신청 내용을 확인해주세요</h1>\n        <div class=\"summary box\">\n          <div><strong>플랜</strong><span>Solo 2주</span></div>\n          <div><strong>배송</strong><span>월·수·금 / 점심</span></div>\n          <div><strong>배송지</strong><span>집 · 대구광역시 중구…</span></div>\n          <div><strong>메뉴</strong><span>총 4개</span></div>\n          <div><strong>예상 결제금액</strong><span>36,200원</span></div>\n        </div>\n        <div class=\"actions end\"><button class=\"btn secondary\" data-go=\"WF-013\">수정</button><button class=\"btn primary\" data-go=\"WF-017\">결제수단 설정</button></div>", "WF-017": "\n        <div class=\"stepper\"><div class=\"step done\"><span>1</span>배송</div><div class=\"step done\"><span>2</span>배송지</div><div class=\"step done\"><span>3</span>메뉴</div><div class=\"step done\"><span>4</span>확인</div><div class=\"step current\"><span>5</span>결제</div></div>\n        <h1>결제수단을 등록해주세요</h1>\n        <div class=\"box\">\n          <div class=\"select-card\"><div><strong>신한카드</strong><p>**** **** **** 1234 · 기본 카드</p></div></div>\n          <button class=\"btn secondary\" >새 카드 등록</button>\n        </div>\n        <label class=\"check\"><input type=\"checkbox\" checked> 2주 단위 자동연장 및 자동결제에 동의합니다.</label>\n        <p class=\"muted\">최초 자동연장은 현재 플랜 만료일 18:00에 시도합니다.</p>\n        <div class=\"actions end\"><button class=\"btn secondary\ <script>
const workspaceEl = document.querySelector(".workspace");
const pcView = document.getElementById("pcView");
const mobileView = document.getElementById("mobileView");

function setPreview(mode){
  workspaceEl.classList.toggle("preview-mobile", mode === "mobile");
  pcView.classList.toggle("active", mode === "pc");
  mobileView.classList.toggle("active", mode === "mobile");
}
pcView.addEventListener("click", () => setPreview("pc"));
mobileView.addEventListener("click", () => setPreview("mobile"));

document.getElementById("navSearch").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll(".nav-item").forEach(btn => {
    const wf = btn.dataset.wf;
    const m = meta[wf];
    const hay = (wf + " " + m.title + " " + m.category + " " + m.desc).toLowerCase();
    btn.style.display = !q || hay.includes(q) ? "flex" : "none";
  });
});

  const retiredScreens = ["WF-056", "WF-057", "WF-058", "WF-059", "WF-060"];

  retiredScreens.forEach((id) => {
    delete meta[id];
    delete templates[id];
  });

  const prototypeRange = document.querySelector('.brand small');
  if (prototypeRange) prototypeRange.textContent = 'Clickable Prototype · WF-001~055';

  document.querySelectorAll('[data-go^="WF-05"], [data-wf^="WF-05"]').forEach((element) => {
    const target = element.dataset.go || element.dataset.wf;
    if (retiredScreens.includes(target)) element.remove();
  });

  document.querySelectorAll('.nav-group').forEach((group) => {
    if (!group.querySelector('.nav-item')) group.remove();
    if (group.querySelector('.nav-title')?.textContent.trim() === '마켓') group.remove();
  });
})();
</script>

<script id="admin-pc-only">
(function(){
  const originalRender = render;
  render = function(wf){
    originalRender(wf);

    const isAdmin = meta[wf] && meta[wf].category === "관리자";
    const mobileBtn = document.getElementById("mobileView");
    const pcBtn = document.getElementById("pcView");
    const workspace = document.querySelector(".workspace");

    if (isAdmin) {
      workspace.classList.remove("preview-mobile");
      if (pcBtn) pcBtn.classList.add("active");
      if (mobileBtn) {
        mobileBtn.classList.remove("active");
        mobileBtn.disabled = true;
        mobileBtn.title = "관리자 화면은 PC 전용입니다.";
      }

      let note = document.getElementById("adminPcOnlyNote");
      if (!note) {
        note = document.createElement("div");
        note.id = "adminPcOnlyNote";
        note.className = "state-note";
        note.style.margin = "0 34px 12px";
        note.innerHTML = "<strong>관리자 화면 · PC 전용</strong><br>운영 효율과 정보 밀도를 우선하여 모바일 레이아웃을 설계하지 않습니다.";
        const canvas = document.querySelector(".canvas-wrap");
        if (canvas) canvas.prepend(note);
      } else {
        note.style.display = "";
      }
    } else {
      if (mobileBtn) {
        mobileBtn.disabled = false;
        mobileBtn.title = "";
      }
      const note = document.getElementById("adminPcOnlyNote");
      if (note) note.style.display = "none";
    }
  };

  // 이미 렌더된 현재 화면에도 즉시 적용
  render(current);
})();
</script>


<script id="auth-state-v5">
(function(){
  let authState = "loggedIn";

  function applyAuthState(){
    const loggedIn = authState === "loggedIn";

    document.querySelectorAll("[data-auth-only]").forEach(el => {
      el.style.display = loggedIn ? "" : "none";
    });
    document.querySelectorAll("[data-guest-only]").forEach(el => {
      el.style.display = loggedIn ? "none" : "";
    });

    const inBtn = document.getElementById("loggedInStateBtn");
    const outBtn = document.getElementById("guestStateBtn");
    if (inBtn) inBtn.classList.toggle("active", loggedIn);
    if (outBtn) outBtn.classList.toggle("active", !loggedIn);

    // 비로그인 상태에서 보호 화면에 있다면 홈으로 이동
    if (!loggedIn && meta[current]) {
      const protectedCats = ["내구독", "마이페이지"];
      if (protectedCats.includes(meta[current].category)) {
        render("WF-001");
      }
    }

    updateMobileNavActive();
  }

  function updateMobileNavActive(){
    const nav = document.getElementById("mobileBottomNav");
    if (!nav || !meta[current]) return;
    nav.querySelectorAll("button").forEach(b => b.classList.remove("active"));

    let key = "";
    const cat = meta[current].category;
    if (current === "WF-001") key = "home";
    else if (cat === "상품") key = "product";
    else if (cat === "구독" || cat === "구독신청") key = "plan";
    else if (cat === "내구독") key = "subscription";
    else if (cat === "마이페이지") key = "mypage";
    else if (cat === "인증" && current === "WF-002") key = "login";
    else if (cat === "인증" && current === "WF-003") key = "signup";

    const active = nav.querySelector('[data-nav-key="' + key + '"]');
    if (active) active.classList.add("active");
  }

  const oldRenderAuth = render;
  render = function(wf){
    oldRenderAuth(wf);
    applyAuthState();
  };

  document.getElementById("loggedInStateBtn")?.addEventListener("click", () => {
    authState = "loggedIn";
    applyAuthState();
  });
  document.getElementById("guestStateBtn")?.addEventListener("click", () => {
    authState = "guest";
    applyAuthState();
  });

  window.__chapchapAuthState = () => authState;
  applyAuthState();
})();
</script>

/* 체험 종료를 서버 상태로 받았을 때만 띄우는 전환 안내입니다.
   사용자가 현재 화면 맥락을 잃지 않도록 모바일에서는 하단 시트, PC에서는 작은 다이얼로그처럼 보입니다. */
function showTrialConversionPrompt() {
  if (document.getElementById('trialConversionPrompt')) return;
  const prompt = document.createElement('section');
  prompt.id = 'trialConversionPrompt';
  prompt.className = 'trial-conversion';
  prompt.setAttribute('role', 'dialog');
  prompt.setAttribute('aria-modal', 'true');
  prompt.innerHTML = `
    <span class="recommend-badge">체험 완료</span>
    <h2>체험 플랜이 종료되었습니다</h2>
    <p class="muted">Solo 또는 Family 플랜으로 다음 구독을 시작할 수 있습니다.</p>
    <div class="actions"><button class="btn secondary" data-close-trial>나중에 결정</button><button class="btn primary" data-go="WF-054">플랜 선택하기</button></div>`;
  document.body.append(prompt);
  prompt.querySelector('[data-close-trial]').addEventListener('click', () => prompt.remove());
  prompt.querySelector('[data-go]').addEventListener('click', () => { prompt.remove(); render('WF-054'); });
}

function applySubscriptionDesign() {
  const adminGroup = [...document.querySelectorAll('.nav-group')].find((group) => group.querySelector('.nav-title')?.textContent.trim() === '관리자');
  if (adminGroup && !adminGroup.querySelector('[data-go="WF-055"]')) {
    adminGroup.insertAdjacentHTML('beforeend', '<button class="nav-item" data-go="WF-055" data-wf="WF-055"><span>055</span>관리자 대시보드</button>');
  }

  document.querySelectorAll('[data-nav-key="product"]').forEach((button) => {
    const label = button.querySelector('span:last-child');
    if (label) label.textContent = '메뉴';
  });
  document.querySelectorAll('.site-header nav button').forEach((button) => {
    if (button.textContent.trim() === '상품') button.textContent = '메뉴';
  });

  if (current === 'WF-010') {
    const soloTitle = [...document.querySelectorAll('.feature-card h2')].find((title) => title.textContent.includes('Solo 2주'));
    const card = soloTitle?.closest('.feature-card');
    if (card && !card.classList.contains('plan-card--recommended')) {
      card.classList.add('plan-card--recommended');
      card.insertAdjacentHTML('afterbegin', '<span class="recommend-badge">★ 추천 플랜</span>');
    }
  }

  if (current === 'WF-012') {
    document.querySelectorAll('[data-go="WF-013"]').forEach((button) => button.classList.add('trial'));
  }

  if (current === 'WF-015' && !document.querySelector('.menu-limit-note')) {
    const note = document.createElement('div');
    note.className = 'menu-limit-note';
    note.innerHTML = '<strong>수량 제한</strong><span>플랜별 주차 최소 수량을 먼저 충족해야 합니다. 선택 가능 수량을 넘기거나 재고가 부족한 메뉴는 선택할 수 없습니다.</span>';
    document.querySelector('.sticky-summary')?.insertAdjacentElement('beforebegin', note);
  }

  // 구독 메뉴는 단건 판매 상품이 아니므로 개별 메뉴 가격을 노출하지 않습니다.
  // 플랜 가격은 정책 확정 전까지 모든 고객 화면에서 '가격 미정'으로 통일합니다.
  if (['WF-001', 'WF-008'].includes(current)) {
    document.querySelectorAll('.product .muted').forEach((label) => {
      const category = label.textContent.includes('KIDS') ? 'KIDS' : 'GENERAL';
      label.textContent = `${category} · 플랜 포함 메뉴`;
    });
  }
  if (current === 'WF-009') {
    const priceHeading = document.querySelector('.detail2 h2');
    if (priceHeading) priceHeading.textContent = '플랜 포함 메뉴 · 가격 미정';
  }
  document.querySelectorAll('strong').forEach((label) => {
    if (['고정가격', '플랜 고정가격'].includes(label.textContent.trim())) label.textContent = '가격 미정';
  });

  if (current === 'WF-021' && !document.querySelector('[data-go="WF-054"]')) {
    const actions = document.querySelector('.actions');
    if (actions) actions.insertAdjacentHTML('beforeend', '<button class="btn secondary" data-go="WF-054">플랜 변경하기</button>');
  }
}

const renderWithSubscriptionDesign = render;
render = function (wf) {
  renderWithSubscriptionDesign(wf);
  applySubscriptionDesign();
};

applySubscriptionDesign();
</script>
